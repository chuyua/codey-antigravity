[package]
name = "codey-plugin-sdk"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[package.metadata.cargo-machete]
# tests/host.rs 通过 #[path] 引入 backend 的插件宿主，这些依赖用于宿主测试。
ignored = ["anyhow", "arc-swap", "libloading", "reqwest", "semver", "uuid"]

[dependencies]
chrono = "0.4"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
